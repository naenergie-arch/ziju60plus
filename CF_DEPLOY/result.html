<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff8a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Žiju60plus">
  <link rel="apple-touch-icon" href="/img/logo.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Váš osobní profil – Žiju 60 plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fbf4e7;min-height:100vh;font-family:'Montserrat',sans-serif;color:#3a2008}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:#fbf4e7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.loader-icon{font-size:52px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.loader-text{margin-top:20px;font-size:15px;color:#a07040;font-family:Georgia,serif;font-style:italic;text-align:center;line-height:1.7}
.loader-dots span{animation:blink 1.4s infinite both}
.loader-dots span:nth-child(2){animation-delay:.2s}
.loader-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* ── LAYOUT ── */
.page{max-width:640px;margin:0 auto;padding:32px 20px 80px}

/* ── HEADER ── */
.profile-header{text-align:center;padding:40px 24px 32px;background:linear-gradient(160deg,#fff8f0 0%,#ffecd6 100%);border-radius:28px;border:1.5px solid #f0ddb8;margin-bottom:24px;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,#ffd0a830 0%,transparent 70%);pointer-events:none}
.profile-badge{display:inline-flex;align-items:center;gap:8px;background:#fff8ee;border:1px solid #e8d0a8;border-radius:999px;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b07840;margin-bottom:20px}
.profile-greeting{font-size:28px;font-family:Georgia,serif;font-style:italic;color:#3a2008;line-height:1.3;margin-bottom:12px}
.profile-date{font-size:12px;color:#b07840;margin-bottom:24px}
.vitality-bars{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.vbar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.vbar-label{font-size:10px;font-weight:600;color:#b07840;text-transform:uppercase;letter-spacing:.06em}
.vbar-bg{width:36px;height:80px;background:#f0ddb8;border-radius:18px;position:relative;overflow:hidden}
.vbar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:18px;transition:height 1s cubic-bezier(.4,0,.2,1)}
.vbar-icon{font-size:16px}

/* ── SKÓRE VITALITY + BIO VĚK ── */
.score-row{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.score-box{background:#fff;border:1.5px solid #e8d0a8;border-radius:18px;padding:14px 22px;text-align:center;min-width:130px}
.score-box.bio{border-color:#52c060;background:#f0fbf2}
.score-num{font-size:30px;font-weight:700;color:#ff8a3d;font-family:Georgia,serif;line-height:1}
.score-box.bio .score-num{color:#2a8a3a}
.score-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b07840;margin-top:4px}
.score-box.bio .score-label{color:#2a8a3a}
.score-note{font-size:10px;color:#a07040;margin-top:3px;line-height:1.4}

/* ── POSTŘEH ── */
.postreh-card{background:#fff;border:1.5px solid #e8d0a8;border-radius:22px;padding:28px 24px;margin-bottom:20px;position:relative}
.postreh-card::before{content:'"';position:absolute;top:12px;left:20px;font-size:72px;font-family:Georgia,serif;color:#ffd0a8;line-height:1;pointer-events:none}
.postreh-text{font-size:16px;font-family:Georgia,serif;font-style:italic;color:#3a2008;line-height:1.75;padding-top:28px}
.silna-box{display:flex;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid #f0ddb8}
.silna-item{flex:1;background:#f8f4ee;border-radius:14px;padding:14px 16px}
.silna-klic{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b07840;margin-bottom:6px}
.silna-val{font-size:13px;color:#3a2008;line-height:1.5;font-family:Georgia,serif;font-style:italic}

/* ── TÝDENNÍ TÉMA ── */
.tema-header{text-align:center;margin:28px 0 16px}
.tema-tag{display:inline-block;background:#ff8a3d;color:#fff;border-radius:999px;padding:8px 22px;font-size:13px;font-weight:700;letter-spacing:.04em}
.tema-sub{font-size:13px;color:#a07040;margin-top:8px}

/* ── CAROUSEL ── */
.carousel-wrap{margin-bottom:28px;position:relative}
.carousel-track-outer{overflow:hidden;border-radius:20px}
.carousel-track{display:flex;transition:transform .38s cubic-bezier(.4,0,.2,1)}
.rec-card{min-width:100%;background:#fff;border:1.5px solid #e8d0a8;border-radius:20px;padding:24px 20px 20px;box-sizing:border-box}
.rec-day{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b07840;margin-bottom:10px}
.rec-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rec-icon{font-size:28px}
.rec-title{font-size:16px;font-family:Georgia,serif;font-style:italic;color:#3a2008;font-weight:700;line-height:1.3}
.rec-desc{font-size:14px;color:#6b4c2a;line-height:1.65;margin-bottom:12px}
.rec-kat{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#b07840;background:#f8f0e4;border-radius:6px;padding:3px 8px;margin-bottom:18px}

/* Přínosy */
.rec-prinos{margin:10px 0 12px;display:flex;flex-direction:column;gap:5px}
.rec-prinos span{font-size:13px;color:#3a7040;font-weight:500}

/* Tip odborníka */
.rec-tip{background:#f0f8f0;border-left:3px solid #52c060;border-radius:0 10px 10px 0;padding:10px 14px;font-size:13px;color:#3a5030;font-style:italic;margin-bottom:14px;line-height:1.5}

/* Odkazy */
.rec-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rec-link{display:inline-flex;align-items:center;gap:5px;background:#fff8ee;border:1.5px solid #e8d0a8;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:#b07840;text-decoration:none;transition:all .18s;cursor:pointer}
.rec-link:hover{border-color:#ff8a3d;background:#fff5ec;color:#c06010}

/* Progress bar */
.rec-progress{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.prog-blocks{display:flex;gap:3px}
.prog-block{width:22px;height:8px;border-radius:4px;background:#e8d0a8}
.prog-block.done{background:#ff8a3d}
.prog-label{font-size:11px;color:#b07840;font-weight:600}

/* Emoji reakce */
.rec-reactions{display:flex;gap:8px;border-top:1px solid #f0ddb8;padding-top:14px}
.reaction-btn{flex:1;background:#f8f4ee;border:1.5px solid #e8d0a8;border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .18s;font-size:12px;color:#8a6040;line-height:1.3}
.reaction-btn .r-emoji{font-size:22px;display:block;margin-bottom:3px}
.reaction-btn:hover{border-color:#ff8a3d;background:#fff5ec}
.reaction-btn.selected{border-color:#ff8a3d;background:#fff5ec;color:#b05010;font-weight:600}

/* Sekce Co čeká dál */
.preview-section{background:linear-gradient(135deg,#fff8f0,#ffecd6);border:1.5px solid #f0ddb8;border-radius:22px;padding:28px 24px;margin-bottom:20px;text-align:center}
.preview-title{font-size:17px;font-family:Georgia,serif;font-style:italic;color:#3a2008;margin-bottom:8px}
.preview-sub{font-size:13px;color:#a07040;margin-bottom:16px;line-height:1.6}
.preview-topics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.preview-topic{background:#fff;border:1.5px solid #e8d0a8;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:#b07840}

/* AI kouč */
.coach-section{background:#3a2008;border-radius:22px;padding:28px 24px;margin-bottom:24px;text-align:center;color:#fff8f0}
.coach-icon{font-size:40px;margin-bottom:12px}
.coach-title{font-size:18px;font-family:Georgia,serif;font-style:italic;margin-bottom:10px}
.coach-desc{font-size:14px;color:#d4b896;line-height:1.65}

/* Navigace carousel */
.carousel-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.car-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid #e8d0a8;background:#fff;color:#b07840;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
.car-btn:hover:not(:disabled){border-color:#ff8a3d;color:#ff8a3d}
.car-btn:disabled{opacity:.35;cursor:default}
.car-dots{display:flex;gap:7px;align-items:center}
.car-dot{width:8px;height:8px;border-radius:50%;background:#e8d0a8;cursor:pointer;transition:all .25s}
.car-dot.active{background:#ff8a3d;transform:scale(1.25)}
.car-progress{font-size:12px;color:#b07840;font-weight:600;margin-left:4px}

/* ── PLÁN 7 DNÍ – wrapper ── */
.plan7-wrap{background:linear-gradient(160deg,#fff8f0 0%,#fff3e6 100%);border:3px solid #f0c060;border-radius:28px;padding:24px 20px 20px;margin-bottom:24px;box-shadow:0 0 0 5px #f5d888, 0 0 0 9px #f0c060, 0 6px 28px rgba(200,150,0,.18)}
.plan7-heading{font-family:Georgia,serif;font-style:italic;font-size:22px;color:#3a2008;text-align:center;margin-bottom:4px}
.plan7-heading-line{width:48px;height:3px;background:linear-gradient(90deg,#ff8a3d,#f0c060);border-radius:2px;margin:0 auto 16px}
.carousel-swipe-hint{text-align:center;font-size:13px;color:#b07840;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;opacity:.8}
.swipe-hand{font-size:18px;animation:nudge 1.8s ease-in-out infinite}
.swipe-hand.left{animation-delay:.3s;transform:scaleX(-1);display:inline-block}
@keyframes nudge{0%,100%{transform:translateX(0)}40%{transform:translateX(5px)}70%{transform:translateX(-5px)}}
@keyframes nudgeL{0%,100%{transform:scaleX(-1) translateX(0)}40%{transform:scaleX(-1) translateX(5px)}70%{transform:scaleX(-1) translateX(-5px)}}
.swipe-hand.left{animation:nudgeL 1.8s ease-in-out infinite;animation-delay:.3s}

/* ── CENÍK ── */
.cenik-section{margin-top:8px}
.cenik-title{font-size:20px;font-family:Georgia,serif;font-style:italic;color:#3a2008;text-align:center;margin-bottom:8px}
.cenik-sub{font-size:14px;color:#a07040;text-align:center;line-height:1.6;margin-bottom:24px}
.price-cards{display:flex;flex-direction:column;gap:14px}
.price-card{background:#fff;border:1.5px solid #e8d0a8;border-radius:20px;padding:22px 20px;position:relative}
.price-card.featured{border-color:#ff8a3d;box-shadow:0 4px 24px #ff8a3d22}
.price-badge-top{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#ff8a3d;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:4px 14px;white-space:nowrap}
.price-name{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b07840;margin-bottom:6px}
.price-amount{font-size:28px;font-weight:700;color:#3a2008;margin-bottom:4px}
.price-amount span{font-size:14px;font-weight:400;color:#a07040}
.price-desc{font-size:13px;color:#6b4c2a;line-height:1.5;margin-bottom:16px}
.price-btn{display:block;width:100%;background:#ff8a3d;color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-family:Georgia,serif;font-style:italic;font-weight:700;cursor:pointer;text-align:center;transition:background .18s}
.price-btn:hover{background:#ff7a1f}
.price-card.featured .price-btn{background:#3a2008}
.price-card.featured .price-btn:hover{background:#5a3018}
.price-note{text-align:center;font-size:12px;color:#b07840;margin-top:20px}

/* ── Access strip ── */
.access-strip{background:#fff;border:1.5px solid #e8d0a8;border-radius:22px;padding:28px 24px;text-align:center}
.access-strip.active{border-color:#52c060;background:#f0fbf2}
.access-strip.expired{border-color:#e05050;background:#fff8f8}
.access-days{font-size:16px;font-family:Georgia,serif;font-style:italic;color:#3a2008;margin-bottom:10px}
.access-sub{font-size:13px;color:#a07040;margin-bottom:16px;line-height:1.6}
.access-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-later{background:none;border:none;color:#b07840;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;padding:4px}

/* ── NOTICE ── */
.saved-notice{background:#f0f8f0;border:1px solid #b8d8b8;border-radius:14px;padding:12px 18px;font-size:13px;color:#3a6030;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.saved-notice a{color:#ff8a3d;font-weight:600;white-space:nowrap;text-decoration:none;font-size:12px}
.saved-notice a:hover{text-decoration:underline}

@media(max-width:480px){
  .vitality-bars{gap:6px}
  .vbar-bg{width:28px;height:64px}
  .profile-greeting{font-size:22px}
  .silna-box{flex-direction:column}
}
</style>
</head>

<script>
const STORAGE_KEY = 'ziju60_profil';

const KAT_LABELS = {
  pohyb:'Pohyb', lide:'Lidé a vztahy', kultura:'Kultura',
  tvorba:'Tvorba', vzdelani:'Vzdělávání', priroda:'Příroda',
  rodina:'Rodina', spanek:'Spánek', jidlo:'Stravování', smysl:'Smysl života'
};

// ── Vokativ (5. pád) pro česká jména ──────────────────────────────
function toVokativ(jmeno, jeZena) {
  if (!jmeno) return '';
  const j = jmeno.trim();
  const low = j.toLowerCase();

  // Lookup table pro nejčastější jména (muž → vokativ)
  const muzLookup = {
    'jan':'Jane','josef':'Josefe','petr':'Petře','pavel':'Pavle',
    'martin':'Martine','tomáš':'Tomáši','ondřej':'Ondřeji','jakub':'Jakube',
    'lukáš':'Lukáši','michal':'Michale','david':'Davide','karel':'Karle',
    'jiří':'Jiří','miroslav':'Miroslav','zdeněk':'Zdeňku','vladimír':'Vladimíre',
    'robert':'Roberte','richard':'Richarde','milan':'Milane','libor':'Libore',
    'roman':'Romane','marek':'Marku','filip':'Filipe','radek':'Radku',
    'tomáš':'Tomáši','stanislav':'Stanislave','jaroslav':'Jaroslav',
    'ladislav':'Ladislave','václav':'Václave','františek':'Františku',
  };
  // Lookup pro ženská jména
  const zenaLookup = {
    'jana':'Jano','marie':'Marie','eva':'Evo','petra':'Petro','lenka':'Lenko',
    'monika':'Moniko','jitka':'Jitko','anna':'Anno','alena':'Aleno','věra':'Věro',
    'helena':'Heleno','hana':'Hano','irena':'Ireno','kateřina':'Kateřino',
    'lucie':'Lucie','markéta':'Markéto','tereza':'Terezo','zuzana':'Zuzano',
    'martina':'Martino','ivana':'Ivano','dagmar':'Dagmar','ilona':'Ilono',
    'radka':'Radko','renata':'Renato','miroslava':'Miroslavo','jiřina':'Jiřino',
  };

  if (jeZena && zenaLookup[low]) return zenaLookup[low];
  if (!jeZena && muzLookup[low]) return muzLookup[low];

  // Obecná pravidla
  if (low.endsWith('a') && !jeZena) return j.slice(0,-1) + 'o'; // Míla→Mílo, Honza→Honzo
  if (low.endsWith('a')) return j.slice(0,-1) + 'o'; // ženy: Jana→Jano
  if (!jeZena) {
    // Muž končící na souhlásku → přidej -e s palatalizací
    if (low.endsWith('k')) return j.slice(0,-1) + 'ku';
    if (low.endsWith('h') || low.endsWith('g')) return j.slice(0,-1) + 'hu';
    if (low.endsWith('r')) return j + 'e';
    if (low.endsWith('l')) return j + 'e';
    if (low.endsWith('n')) return j + 'e';
    if (low.endsWith('t')) return j + 'e';
    if (low.endsWith('d')) return j + 'e';
    if (low.endsWith('b')) return j + 'e';
    if (low.endsWith('p')) return j + 'e';
    if (low.endsWith('v')) return j + 'e';
    if (low.endsWith('f')) return j + 'e';
    if (low.endsWith('š') || low.endsWith('č') || low.endsWith('ž')) return j + 'i';
  }
  return j; // fallback – ponech jak je
}

function barColor(val) {
  if (val >= 3) return '#52c060';
  if (val >= 2) return '#ff8a3d';
  return '#e05050';
}
function barHeight(val) { return Math.round((val / 3) * 100) + '%'; }

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - (obj.ts||0) > 7*24*3600*1000) return null;
    return obj;
  } catch { return null; }
}
function saveProfile(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({...data, ts:Date.now()})); } catch {}
}
function clearSaved() {
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
}

function renderRec(data) {
  const el = document.getElementById('recList');
  const items = (data.doporuceni||[]).slice(0,7);
  const reactions = loadReactions();

  // Track
  const cardsHtml = items.map((r,i) => {
    const sel = reactions[i] || '';
    const rBtns = [
      {e:'🌟', label:'Skvělé!'},
      {e:'🤔', label:'Nevím'},
      {e:'⏳', label:'Udělám later'},
    ].map(rb => `
      <button class="reaction-btn${sel===rb.e?' selected':''}" data-idx="${i}" data-emoji="${rb.e}" onclick="pickReaction(${i},'${rb.e}')">
        <span class="r-emoji">${rb.e}</span>${rb.label}
      </button>`).join('');

    // Progress bar: den i+1 ze 7
    const progBlocks = Array.from({length:7},(_,b)=>
      `<div class="prog-block${b<i+1?' done':''}"></div>`).join('');

    // Přínosy
    const prinosHtml = (r.prinos||[]).map(p=>`<span>${p}</span>`).join('');

    // Tip odborníka
    const tipHtml = r.tip ? `<div class="rec-tip">💡 ${r.tip}</div>` : '';

    // 2 odkazy z Knihovny života (objekt {nazev, url})
    const link = (obj) => {
      if (!obj || !obj.url) return '';
      const safe = obj.url.replace(/"/g, '%22');
      return `<a class="rec-link" href="${safe}" target="_blank" rel="noopener">🔗 ${obj.nazev || 'Více informací'}</a>`;
    };
    const odkazyHtml = (r.odkaz1?.url || r.odkaz2?.url)
      ? `<div class="rec-links">${link(r.odkaz1)}${link(r.odkaz2)}</div>` : '';

    return `<div class="rec-card">
      <div class="rec-progress">
        <div class="prog-blocks">${progBlocks}</div>
        <div class="prog-label">Den ${i+1} ze 7</div>
      </div>
      <div class="rec-top">
        <span class="rec-icon">${r.ikona||'🌸'}</span>
        <span class="rec-title">${r.nazev||''}</span>
      </div>
      <div class="rec-desc">${r.popis||''}</div>
      ${prinosHtml ? `<div class="rec-prinos">${prinosHtml}</div>` : ''}
      ${tipHtml}
      ${odkazyHtml}
      ${r.kat?`<span class="rec-kat">${KAT_LABELS[r.kat]||r.kat}</span>`:''}
      <div class="rec-reactions">${rBtns}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="carousel-track-outer">
      <div class="carousel-track" id="carTrack">${cardsHtml}</div>
    </div>
    <div class="carousel-nav">
      <button class="car-btn" id="carPrev" onclick="carMove(-1)">‹</button>
      <div class="car-dots" id="carDots">
        ${items.map((_,i)=>`<div class="car-dot${i===0?' active':''}" onclick="carGo(${i})"></div>`).join('')}
      </div>
      <button class="car-btn" id="carNext" onclick="carMove(1)">›</button>
    </div>
    <div class="carousel-swipe-hint">
      <span class="swipe-hand left">👈</span>
      <span>přejeďte pro další den</span>
      <span class="swipe-hand">👉</span>
    </div>`;

  initCarousel(items.length);
}

function pickReaction(idx, emoji) {
  saveReaction(idx, emoji);
  document.querySelectorAll(`.reaction-btn[data-idx="${idx}"]`).forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.emoji === emoji);
  });
}

function initCarousel(total) {
  let cur = 0;
  const track = () => document.getElementById('carTrack');
  const dots  = () => document.querySelectorAll('.car-dot');

  function go(n) {
    cur = Math.max(0, Math.min(total-1, n));
    track().style.transform = `translateX(-${cur*100}%)`;
    dots().forEach((d,i) => d.classList.toggle('active', i===cur));
    document.getElementById('carPrev').disabled = cur===0;
    document.getElementById('carNext').disabled = cur===total-1;
  }

  window.carMove = (d) => go(cur+d);
  window.carGo   = (n) => go(n);
  go(0);

  // Swipe
  let tx=0;
  const outer = document.querySelector('.carousel-track-outer');
  outer.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; }, {passive:true});
  outer.addEventListener('touchend',   e=>{
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx)>40) go(cur + (dx<0?1:-1));
  }, {passive:true});
}

// ── Přístupová úroveň dle localStorage ───────────────────────────
const ACCESS_KEY = 'ziju60_access';
const DAY_MS = 24 * 3600 * 1000;

function getAccessLevel() {
  const profile = loadSaved();
  const profileAge = profile ? Date.now() - (profile.ts || 0) : Infinity;
  let paid = null;
  try { paid = JSON.parse(localStorage.getItem(ACCESS_KEY) || 'null'); } catch {}

  if (paid?.level === 'yearly') return 'yearly';
  if (paid?.level === '90d') {
    return (Date.now() - paid.ts < 90 * DAY_MS) ? 'active90' : 'expired90';
  }
  if (paid?.level === '30d') {
    return (Date.now() - paid.ts < 30 * DAY_MS) ? 'active30' : 'expired30';
  }
  return profileAge < 7 * DAY_MS ? 'free_active' : 'free_expired';
}

function daysLeft(ts, totalDays) {
  return Math.max(0, totalDays - Math.floor((Date.now() - ts) / DAY_MS));
}

async function startCheckout(plan) {
  const btn = document.querySelector(`[data-plan="${plan}"]`);
  if (btn) { btn.textContent = 'Přesměrováváme…'; btn.disabled = true; }
  try {
    const r = await fetch('/api/create-checkout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan })
    });
    const d = await r.json();
    if (d.url) window.location.href = d.url;
    else throw new Error(d.error || 'Chyba');
  } catch {
    if (btn) { btn.textContent = 'Chyba – zkuste znovu'; btn.disabled = false; }
  }
}

async function generateProfile() {
  const answers = {
    jmeno: urlJmeno, pohlavi: urlPohlavi,
    pohyb: urlPohyb, nalada: urlNalada, spojeni: urlSpojeni,
    spanek: urlSpanek, motivace: urlMotivace, text: urlText, zalib: urlZalib,
    vek_skutecny: urlVekSkutecny, vek_pocitovy: urlVekPocitovy
  };
  const res = await fetch('/api/diagnosticky-postreh', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({answers})
  });
  if (!res.ok) throw new Error('AI chyba ' + res.status);
  const data = await res.json();
  // Ulož i skóre do profilu
  return {
    ...data,
    jmeno: urlJmeno, pohlavi: urlPohlavi,
    pohyb: urlPohyb, nalada: urlNalada, spojeni: urlSpojeni,
    spanek: urlSpanek, motivace: urlMotivace,
    vek_skutecny: urlVekSkutecny, vek_pocitovy: urlVekPocitovy
  };
}

async function init() {
  const saved = loadSaved();

  // Pokud přišel z kvízu (má URL params s jménem) a uložený profil je JINÉHO člověka → vygeneruj nový
  const savedName = saved?.jmeno || '';
  const hasNewParams = urlJmeno && (urlJmeno !== savedName || !saved?.postreh);

  if (saved && saved.postreh && !hasNewParams) {
    const expiry = new Date(saved.ts + 7*24*3600*1000).toLocaleDateString('cs-CZ');
    document.getElementById('savedNotice').innerHTML = `
      <div class="saved-notice">
        💾 Zobrazujeme váš uložený profil. Platí do ${expiry}.
        <a href="/quiz.html" onclick="localStorage.removeItem('${STORAGE_KEY}')">Vytvořit nový profil →</a>
      </div>`;
    showProfile(saved);
    return;
  }

  // Vygeneruj nový
  try {
    const data = await generateProfile();
    saveProfile(data);
    showProfile(data);
  } catch(e) {
    document.getElementById('loader').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:40px;margin-bottom:16px">😔</div>
        <div style="font-size:16px;color:#a07040;font-family:Georgia,serif;font-style:italic">
          Omlouváme se, profil se nepodařilo načíst.<br>
          <a href="/quiz.html" style="color:#ff8a3d">Zkuste to znovu →</a>
        </div>
      </div>`;
  }
}

function showProfile(data) {
  renderHeader(data);
  renderPostreh(data);
  renderTema(data);
  renderRec(data);
  renderPreview();
  renderCoach();
  renderCenik();
  document.getElementById('page').style.display = '';
  const loader = document.getElementById('loader');
  loader.classList.add('hide');
  setTimeout(()=>loader.style.display='none', 700);
  window.scrollTo({top:0});
}

init();

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBanner').style.display = '';
});
document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
  deferredInstallPrompt = null;
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').style.display = 'none';
});

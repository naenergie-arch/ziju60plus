<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Váš příběh – Žiju 60 plus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  min-height: 100vh;
  background: #0a0814;
  font-family: Georgia, 'Times New Roman', serif;
  overflow: hidden;
  position: relative;
}

#canvas {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

.bg-glow {
  position: fixed; bottom: -30%; left: 50%;
  transform: translateX(-50%);
  width: 120vw; height: 60vh;
  background: radial-gradient(ellipse at center, rgba(255,140,40,0.16) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* Horní logo */
.film-logo {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 20; font-size: 12px;
  color: rgba(255,230,170,0.35);
  letter-spacing: 3px; text-transform: uppercase;
}

/* Loading */
.loading-wrap {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  z-index: 10; text-align: center;
  color: rgba(255,230,170,0.45);
  font-family: Arial,sans-serif; font-size: 14px; letter-spacing: 2px;
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,200,100,0.15);
  border-top-color: rgba(255,200,100,0.7);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FILMOVÉ TITULKY ── */
/* Okno — skrývá text mimo viewport */
.credits-window {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden;
  z-index: 10;
  display: none;
}

/* Blok titulků — startuje dole, plyne nahoru */
.credits-inner {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  width: min(680px, 92vw);
  text-align: center;
  padding-bottom: 80px;
  /* JS nastaví top a spustí animaci */
}

.credits-veta {
  font-size: clamp(19px, 3.6vw, 25px);
  line-height: 1.75;
  font-style: italic;
  color: rgba(255, 248, 230, 0.92);
  margin-bottom: 52px;
  text-shadow: 0 0 50px rgba(255,200,100,0.18);
}
.credits-veta:last-of-type { margin-bottom: 0; }

/* Tlačítko Zobrazit plán */
.btn-plan {
  display: none;
  margin-top: 60px;
  background: linear-gradient(135deg, #ff9a4d 0%, #e06010 100%);
  color: #fff; border: none;
  border-radius: 40px; padding: 20px 56px;
  font-size: 20px; font-family: Georgia,serif;
  font-style: italic; font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(224,96,16,0.45);
  opacity: 0;
}
.btn-plan.show { animation: riseIn 1.4s ease forwards; }
.btn-plan:hover { transform: translateY(-3px); box-shadow: 0 10px 36px rgba(224,96,16,0.55); }

/* Tlačítka dole */
.btn-music {
  position: fixed; bottom: 22px; left: 26px; z-index: 30;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.45);
  font-size: 17px; width: 40px; height: 40px;
  border-radius: 50%; cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.btn-music:hover { background: rgba(255,255,255,0.14); color:#fff; }
.btn-music.on { background: rgba(255,200,100,0.18); border-color:rgba(255,200,100,0.5); color:rgba(255,220,120,0.9); }

.btn-skip {
  position: fixed; bottom: 26px; right: 26px; z-index: 30;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.4);
  font-size: 13px; font-family: Arial,sans-serif;
  padding: 8px 16px; border-radius: 20px;
  cursor: pointer; transition: all 0.3s;
}
.btn-skip:hover { background: rgba(255,255,255,0.14); color:#fff; }

/* Overlay přechod */
#overlay {
  position: fixed; inset: 0;
  background: #fff; opacity: 0;
  pointer-events: none; z-index: 100;
  transition: opacity 0.8s ease;
}
#overlay.fade { opacity:1; pointer-events:all; }

@keyframes riseIn {
  from { opacity:0; transform:translateY(22px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="film-logo">Žiju 60 plus</div>

<div class="loading-wrap" id="loadingWrap">
  <div class="spinner"></div>
  <div>Připravujeme Váš příběh…</div>
</div>

<div class="credits-window" id="creditsWindow">
  <div class="credits-inner" id="creditsInner">
    <!-- věty + tlačítko vloží JS -->
  </div>
</div>

<button class="btn-music" id="btnMusic" onclick="toggleMusic()" title="Zapnout hudbu">🎵</button>
<button class="btn-skip" onclick="skipToEnd()">Přeskočit →</button>
<div id="overlay"></div>

<script>
const p = new URLSearchParams(location.search);
const allParams = p.toString();

// ── Canvas částice ──
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let pts = [];
function resizeCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
function mkPt(){ return {x:Math.random()*canvas.width, y:canvas.height+20, r:Math.random()*2+0.4, sp:Math.random()*0.4+0.12, a:Math.random()*0.32+0.07, dx:(Math.random()-.5)*0.22, h:Math.random()*38+26}; }
for(let i=0;i<60;i++){ const pt=mkPt(); pt.y=Math.random()*canvas.height; pts.push(pt); }
(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fillStyle=`hsla(${pt.h},78%,70%,${pt.a})`; ctx.fill(); pt.y-=pt.sp; pt.x+=pt.dx; if(pt.y<-10) Object.assign(pt,mkPt()); });
  requestAnimationFrame(loop);
})();

// ── Flétna — Web Audio API ──
let audioCtx=null, masterGain=null, musicOn=false;
// Noty: jednoduchá pentatonická melodie (C4 dur)
const NOTES = [261.6, 293.7, 329.6, 392.0, 440.0, 392.0, 349.2, 329.6, 293.7, 261.6, 293.7, 329.6];
const NOTE_DUR = 1.3; // sekund
let noteTimer = null;
let noteIdx = 0;

function initAudio(){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
}

function playNote(freq, when){
  const osc  = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator(); // harmonická — jemnější flétna
  const env  = audioCtx.createGain();

  osc.type  = 'sine';
  osc2.type = 'triangle';
  osc.frequency.value  = freq;
  osc2.frequency.value = freq * 2.01; // oktáva nahoře, lehce detunovaná

  const g1 = audioCtx.createGain(); g1.gain.value = 0.7;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.18;
  osc.connect(g1);  g1.connect(env);
  osc2.connect(g2); g2.connect(env);
  env.connect(masterGain);

  // ADSR obal — flétna má měkký nástup
  env.gain.setValueAtTime(0, when);
  env.gain.linearRampToValueAtTime(0.55, when + 0.18);  // attack
  env.gain.linearRampToValueAtTime(0.38, when + 0.4);   // decay
  env.gain.setValueAtTime(0.38, when + NOTE_DUR - 0.25);
  env.gain.linearRampToValueAtTime(0, when + NOTE_DUR);  // release

  osc.start(when);  osc.stop(when + NOTE_DUR + 0.05);
  osc2.start(when); osc2.stop(when + NOTE_DUR + 0.05);
}

function scheduleMelody(){
  if(!musicOn) return;
  const when = audioCtx.currentTime + 0.05;
  playNote(NOTES[noteIdx % NOTES.length], when);
  noteIdx++;
  noteTimer = setTimeout(scheduleMelody, NOTE_DUR * 1000);
}

function toggleMusic(){
  if(!audioCtx) initAudio();
  const btn = document.getElementById('btnMusic');
  if(!musicOn){
    masterGain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 1.5);
    musicOn = true;
    btn.classList.add('on'); btn.title='Vypnout hudbu';
    scheduleMelody();
  } else {
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
    musicOn = false;
    clearTimeout(noteTimer);
    btn.classList.remove('on'); btn.title='Zapnout hudbu';
  }
}

// ── Navigace ──
function goToResult(){
  document.getElementById('overlay').classList.add('fade');
  setTimeout(()=>{ window.location.href='/result.html?'+allParams; }, 850);
}

// ── Scroll titulků ──
let scrollAnim = null; // requestAnimationFrame ID
let scrollPos  = 0;    // aktuální top v px
let totalHeight = 0;   // výška creditsInner
let scrollDone  = false;

function startScroll(){
  const win   = document.getElementById('creditsWindow');
  const inner = document.getElementById('creditsInner');
  win.style.display = 'block';

  // Začínáme pod obrazovkou
  scrollPos = window.innerHeight + 40;
  inner.style.top = scrollPos + 'px';
  totalHeight = inner.offsetHeight;

  // Cíl: přesunout tlačítko do středu obrazovky
  // = scrollovat dokud není tlačítko (poslední dítě) v centru
  const speed = 0.55; // px/frame = cca 33px/s při 60fps — pomalé a elegantní

  function frame(){
    if(scrollDone) return;
    scrollPos -= speed;
    inner.style.top = scrollPos + 'px';

    // Konec = celý text přejel + trochu navíc (tlačítko je vidět ve středu)
    const endPos = -(totalHeight - window.innerHeight * 0.55);
    if(scrollPos <= endPos){
      scrollDone = true;
      showPlanBtn();
      return;
    }
    scrollAnim = requestAnimationFrame(frame);
  }
  scrollAnim = requestAnimationFrame(frame);
}

function skipToEnd(){
  // Zastavíme scroll a zobrazíme tlačítko hned
  scrollDone = true;
  cancelAnimationFrame(scrollAnim);
  const inner = document.getElementById('creditsInner');
  // Přesuneme na finální pozici
  const endPos = -(totalHeight - window.innerHeight * 0.55);
  inner.style.top = Math.min(endPos, scrollPos) + 'px';
  showPlanBtn();
}

function showPlanBtn(){
  const btn = document.getElementById('planBtn');
  if(btn) { btn.style.display='inline-block'; requestAnimationFrame(()=>btn.classList.add('show')); }
}

// ── Načtení vět z API ──
async function loadFilm(){
  const answers = {};
  p.forEach((v,k)=>{ answers[k]=(!isNaN(v)&&v!=='')? Number(v):v; });
  try{
    const res = await fetch('/api/film-o-vas',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answers})
    });
    const data = await res.json();
    if(data.error||!data.vety?.length) throw new Error();
    buildCredits(data.vety);
  } catch(_){
    goToResult();
  }
}

function buildCredits(vety){
  document.getElementById('loadingWrap').style.display='none';
  const inner = document.getElementById('creditsInner');
  inner.innerHTML='';

  // Věty
  vety.forEach(text=>{
    const p2 = document.createElement('p');
    p2.className = 'credits-veta';
    p2.textContent = text;
    inner.appendChild(p2);
  });

  // Tlačítko (skryté, zobrazí se až po skončení scrollu)
  const btn = document.createElement('button');
  btn.className = 'btn-plan';
  btn.id = 'planBtn';
  btn.textContent = 'Zobrazit můj plán →';
  btn.onclick = goToResult;
  inner.appendChild(btn);

  startScroll();
}

loadFilm();
</script>
</body>
</html>

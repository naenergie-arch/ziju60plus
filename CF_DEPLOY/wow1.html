<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Váš příběh – Žiju 60 plus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  min-height: 100vh;
  background: #0a0814;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Georgia, 'Times New Roman', serif;
  overflow: hidden;
  position: relative;
}

#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.bg-glow {
  position: fixed;
  bottom: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 120vw;
  height: 60vh;
  background: radial-gradient(ellipse at center, rgba(255,140,40,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Logo */
.film-logo {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: Georgia, serif;
  font-size: 13px;
  color: rgba(255,230,170,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* Kontejner vět — pevně uprostřed obrazovky */
.film-wrap {
  position: relative;
  z-index: 10;
  max-width: 680px;
  width: 92%;
  padding: 20px 20px 100px;
  text-align: center;
}

/* Každá věta — slide-up animace */
.film-veta {
  font-size: clamp(19px, 3.8vw, 26px);
  line-height: 1.7;
  color: rgba(255, 248, 230, 0);
  margin-bottom: 32px;
  font-style: italic;
  transform: translateY(50px);
  transition: color 1.8s ease, transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.film-veta.visible {
  color: rgba(255, 248, 230, 0.93);
  transform: translateY(0);
}

/* Progress tečky */
.progress-dots {
  position: fixed;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 20;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  transition: background 0.6s, transform 0.4s;
}
.dot.active { background: rgba(255,200,100,0.85); transform: scale(1.35); }
.dot.done   { background: rgba(255,200,100,0.38); }

/* Tlačítko Přeskočit */
.btn-skip {
  position: fixed;
  bottom: 26px;
  right: 26px;
  z-index: 30;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.45);
  font-size: 13px;
  font-family: Arial, sans-serif;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-skip:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* Tlačítko Hudba */
.btn-music {
  position: fixed;
  bottom: 22px;
  left: 26px;
  z-index: 30;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.45);
  font-size: 17px;
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.btn-music:hover { background: rgba(255,255,255,0.14); color: #fff; }
.btn-music.on { background: rgba(255,200,100,0.18); border-color: rgba(255,200,100,0.5); color: rgba(255,220,120,0.9); }

/* Tlačítko Zobrazit plán */
.btn-plan {
  display: none;
  margin-top: 12px;
  background: linear-gradient(135deg, #ff9a4d 0%, #e06010 100%);
  color: #fff;
  border: none;
  border-radius: 40px;
  padding: 18px 52px;
  font-size: 20px;
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(224,96,16,0.45);
  opacity: 0;
  transform: translateY(20px);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-plan.show {
  display: inline-block;
  animation: riseIn 1.4s ease forwards;
}
.btn-plan:hover { transform: translateY(-3px); box-shadow: 0 10px 36px rgba(224,96,16,0.55); }

/* Loading */
.loading-wrap {
  position: relative;
  z-index: 10;
  text-align: center;
  color: rgba(255,230,170,0.45);
  font-family: Arial, sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,200,100,0.18);
  border-top-color: rgba(255,200,100,0.7);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}

/* Bílý overlay */
#overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: opacity 0.8s ease;
}
#overlay.fade { opacity: 1; pointer-events: all; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes riseIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="film-logo">Žiju 60 plus</div>

<div id="mainContent">
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <div>Připravujeme Váš příběh…</div>
  </div>
  <div class="film-wrap" id="filmWrap" style="display:none"></div>
</div>

<div class="progress-dots" id="progressDots" style="display:none"></div>
<button class="btn-music" id="btnMusic" onclick="toggleMusic()" title="Zapnout hudbu">🎵</button>
<button class="btn-skip" onclick="goToResult()">Přeskočit →</button>
<div id="overlay"></div>

<script>
const p = new URLSearchParams(location.search);
const allParams = p.toString();

// ── Canvas částice ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function makeParticle() {
  return {
    x: Math.random() * canvas.width,
    y: canvas.height + 20,
    r: Math.random() * 2.2 + 0.4,
    speed: Math.random() * 0.45 + 0.15,
    alpha: Math.random() * 0.35 + 0.08,
    drift: (Math.random() - 0.5) * 0.25,
    hue: Math.random() * 40 + 28
  };
}
for (let i = 0; i < 65; i++) { const pt = makeParticle(); pt.y = Math.random() * canvas.height; particles.push(pt); }

(function animParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(pt => {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${pt.hue},80%,70%,${pt.alpha})`;
    ctx.fill();
    pt.y -= pt.speed; pt.x += pt.drift;
    if (pt.y < -10) Object.assign(pt, makeParticle());
  });
  requestAnimationFrame(animParticles);
})();

// ── Web Audio ambient pad ──
let audioCtx = null, masterGain = null, musicOn = false;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  // Jemný C-dur akord — sine vlny
  [130.8, 164.8, 196, 261.6].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    // Pomalé vibrato
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    lfo.frequency.value = 0.12 + i * 0.04;
    lfoG.gain.value = 0.8;
    lfo.connect(lfoG);
    lfoG.connect(osc.frequency);
    lfo.start();
    g.gain.value = [0.07, 0.05, 0.06, 0.04][i];
    osc.connect(g);
    g.connect(masterGain);
    osc.start();
  });
}

function toggleMusic() {
  if (!audioCtx) initAudio();
  const btn = document.getElementById('btnMusic');
  if (!musicOn) {
    masterGain.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 2.5);
    btn.classList.add('on');
    btn.title = 'Vypnout hudbu';
    musicOn = true;
  } else {
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
    btn.classList.remove('on');
    btn.title = 'Zapnout hudbu';
    musicOn = false;
  }
}

// ── Navigace ──
function goToResult() {
  document.getElementById('overlay').classList.add('fade');
  setTimeout(() => { window.location.href = '/result.html?' + allParams; }, 850);
}

// ── Načtení vět ──
async function loadFilm() {
  const answers = {};
  p.forEach((v, k) => { answers[k] = (!isNaN(v) && v !== '') ? Number(v) : v; });
  try {
    const res = await fetch('/api/film-o-vas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers })
    });
    const data = await res.json();
    if (data.error || !data.vety?.length) throw new Error();
    showFilm(data.vety);
  } catch (_) {
    goToResult();
  }
}

// ── Animace vět ──
let currentIdx = 0, vety = [];

function showFilm(filmVety) {
  vety = filmVety;
  document.getElementById('loadingWrap').style.display = 'none';

  const wrap = document.getElementById('filmWrap');
  wrap.style.display = 'block';

  // Elementy vět
  vety.forEach(text => {
    const el = document.createElement('p');
    el.className = 'film-veta';
    el.textContent = text;
    wrap.appendChild(el);
  });

  // Progress tečky
  const dotsEl = document.getElementById('progressDots');
  dotsEl.style.display = 'flex';
  vety.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    dotsEl.appendChild(d);
  });

  showNextVeta();
}

function showNextVeta() {
  if (currentIdx >= vety.length) { onFilmEnd(); return; }

  const els  = document.querySelectorAll('.film-veta');
  const dots = document.querySelectorAll('.dot');

  dots.forEach((d, i) => {
    d.classList.toggle('done',   i < currentIdx);
    d.classList.toggle('active', i === currentIdx);
  });

  // Slide-up: věta je v DOM ale skrytá (opacity 0, translateY 50px)
  // Přidáme třídu 'visible' → CSS přechod 1.8s
  requestAnimationFrame(() => requestAnimationFrame(() => {
    els[currentIdx].classList.add('visible');
  }));

  currentIdx++;
  // 8 sekund na přečtení každé věty
  setTimeout(showNextVeta, 8000);
}

function onFilmEnd() {
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    d.classList.add('done');
  });

  // Žádný auto-advance — uživatel musí kliknout
  const wrap = document.getElementById('filmWrap');
  const btn = document.createElement('button');
  btn.className = 'btn-plan';
  btn.textContent = 'Zobrazit můj plán →';
  btn.onclick = goToResult;
  wrap.appendChild(btn);
  requestAnimationFrame(() => btn.classList.add('show'));
}

loadFilm();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Váš příběh – Žiju 60 plus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0814;font-family:Georgia,'Times New Roman',serif;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

#canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bg-glow{position:fixed;bottom:-30%;left:50%;transform:translateX(-50%);width:120vw;height:60vh;background:radial-gradient(ellipse at center,rgba(255,140,40,.16) 0%,transparent 70%);pointer-events:none;z-index:0}
.film-logo{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;font-size:12px;color:rgba(255,230,170,.35);letter-spacing:3px;text-transform:uppercase}

/* Loading */
.loading-wrap{position:relative;z-index:10;text-align:center;color:rgba(255,230,170,.45);font-family:Arial,sans-serif;font-size:14px;letter-spacing:2px}
.spinner{width:36px;height:36px;border:2px solid rgba(255,200,100,.15);border-top-color:rgba(255,200,100,.7);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Věty — zobrazují se jedna po druhé, ale ZŮSTÁVAJÍ viditelné */
.film-wrap{position:relative;z-index:10;max-width:660px;width:92%;padding:20px 20px 90px;text-align:center;display:none}

.film-veta{
  font-size:clamp(18px,3.5vw,24px);
  line-height:1.8;
  font-style:italic;
  color:rgba(255,248,230,0);
  margin-bottom:36px;
  transform:translateY(28px);
  transition:color 1.6s ease, transform 1.6s cubic-bezier(.22,1,.36,1);
}
.film-veta.visible{
  color:rgba(255,248,230,.92);
  transform:translateY(0);
}

/* Tlačítko plán */
.btn-plan{
  display:none;
  margin-top:8px;
  background:linear-gradient(135deg,#ff9a4d 0%,#e06010 100%);
  color:#fff;border:none;border-radius:40px;
  padding:18px 52px;font-size:20px;
  font-family:Georgia,serif;font-style:italic;font-weight:bold;
  cursor:pointer;box-shadow:0 6px 30px rgba(224,96,16,.45);
  opacity:0;transition:transform .2s,box-shadow .2s;
}
.btn-plan.show{animation:riseIn 1.4s ease forwards}
.btn-plan:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(224,96,16,.55)}

/* Hudba — vlevo dole */
.music-group{position:fixed;bottom:22px;left:24px;z-index:30;display:flex;align-items:center;gap:10px}
.btn-music{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
.btn-music:hover{background:rgba(255,255,255,.15);color:#fff}
.btn-music.on{background:rgba(255,200,100,.18);border-color:rgba(255,200,100,.5);color:rgba(255,220,120,.9)}
.music-hint{font-family:Arial,sans-serif;font-size:11.5px;color:rgba(255,230,170,.38);line-height:1.45;max-width:180px;transition:opacity .5s ease}
.music-hint.hidden{opacity:0;pointer-events:none}

/* Přeskočit — vpravo dole, samostatně */
.btn-skip{position:fixed;bottom:20px;right:20px;z-index:200;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6);font-size:15px;font-family:Arial,sans-serif;padding:12px 24px;border-radius:24px;cursor:pointer;transition:all .3s;-webkit-tap-highlight-color:transparent}
.btn-skip:hover,.btn-skip:active{background:rgba(255,255,255,.25);color:#fff}

/* Overlay */
#overlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .8s ease}
#overlay.fade{opacity:1;pointer-events:all}

@keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="film-logo">Žiju 60 plus</div>

<div class="loading-wrap" id="loadingWrap">
  <div class="spinner"></div>
  <div>Připravujeme Váš příběh…</div>
</div>

<div class="film-wrap" id="filmWrap"></div>

<div class="music-group">
  <button class="btn-music" id="btnMusic" onclick="toggleMusic()" title="Zapnout zvukový doprovod">🎵</button>
  <div class="music-hint" id="musicHint">Kliknutím spustíte<br>zvukový doprovod</div>
</div>
<button class="btn-skip" onclick="skipFilm()">Přeskočit →</button>

<audio id="bgAudio" loop preload="none">
  <source src="/audio/relax.mp3?v=2" type="audio/mpeg">
</audio>

<div id="overlay"></div>

<script>
const p = new URLSearchParams(location.search);
const allParams = p.toString();

// ── Canvas částice ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let pts = [];
function resizeCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
function mkPt(){ return {x:Math.random()*canvas.width, y:canvas.height+20, r:Math.random()*2+0.4, sp:Math.random()*.38+.1, a:Math.random()*.3+.06, dx:(Math.random()-.5)*.2, h:Math.random()*38+26}; }
for(let i=0;i<60;i++){ const pt=mkPt(); pt.y=Math.random()*canvas.height; pts.push(pt); }
(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fillStyle=`hsla(${pt.h},75%,70%,${pt.a})`; ctx.fill(); pt.y-=pt.sp; pt.x+=pt.dx; if(pt.y<-10) Object.assign(pt,mkPt()); });
  requestAnimationFrame(loop);
})();

// ── Hudba ──
const audio = document.getElementById('bgAudio');
let musicOn = false;

function toggleMusic(){
  const btn  = document.getElementById('btnMusic');
  const hint = document.getElementById('musicHint');
  if(!musicOn){
    audio.volume = 0.35;
    audio.play().catch(()=>{});
    btn.classList.add('on'); btn.title='Vypnout hudbu';
    hint.classList.add('hidden');
    musicOn = true;
  } else {
    audio.pause(); audio.currentTime = 0;
    btn.classList.remove('on'); btn.title='Zapnout zvukový doprovod';
    hint.classList.remove('hidden');
    musicOn = false;
  }
}

// ── Navigace ──
function goToResult(){
  audio.pause();
  document.getElementById('overlay').classList.add('fade');
  setTimeout(()=>{ window.location.href='/result.html?'+allParams; }, 850);
}

// ── Animace vět — jedna po druhé, všechny zůstanou viditelné ──
let vetaIdx = 0;
let vetaTimers = [];
let filmDone = false;
let filmStarted = false;

function showNextVeta(){
  const els = document.querySelectorAll('.film-veta');
  if(vetaIdx >= els.length){ showPlanBtn(); return; }
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    els[vetaIdx].classList.add('visible');
    vetaIdx++;
    if(vetaIdx < els.length){
      const t = setTimeout(showNextVeta, 5500);
      vetaTimers.push(t);
    } else {
      const t = setTimeout(showPlanBtn, 5000);
      vetaTimers.push(t);
    }
  }));
}

function showPlanBtn(){
  filmDone = true;
  const btn = document.getElementById('planBtn');
  if(btn){ btn.style.display='inline-block'; requestAnimationFrame(()=>btn.classList.add('show')); }
}

function skipFilm(){
  vetaTimers.forEach(t=>clearTimeout(t));
  goToResult();
}

// ── Načtení vět z API ──
async function loadFilm(){
  const answers = {};
  p.forEach((v,k)=>{ answers[k]=(!isNaN(v)&&v!=='')? Number(v):v; });
  try{
    const res = await fetch('/api/film-o-vas',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answers})
    });
    const data = await res.json();
    if(data.error||!data.vety?.length) throw new Error();
    buildFilm(data.vety);
  } catch(_){ goToResult(); }
}

function buildFilm(vety){
  document.getElementById('loadingWrap').style.display='none';
  const wrap = document.getElementById('filmWrap');
  wrap.style.display = 'block';
  wrap.innerHTML = '';

  vety.forEach(text=>{
    const el = document.createElement('p');
    el.className = 'film-veta';
    el.textContent = text;
    wrap.appendChild(el);
  });

  const btn = document.createElement('button');
  btn.className='btn-plan'; btn.id='planBtn';
  btn.textContent='Zobrazit můj plán →';
  btn.onclick = goToResult;
  wrap.appendChild(btn);

  filmStarted = true;
  // Krátká pauza pak první věta
  const t = setTimeout(showNextVeta, 800);
  vetaTimers.push(t);
}

loadFilm();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff8a3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Žiju60plus">
  <link rel="apple-touch-icon" href="/favicon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Děkujeme – Žiju 60 plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .dekujeme-wrap {
    max-width: 580px;
    margin: 60px auto;
    padding: 48px 36px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
    text-align: center;
  }
  .dekujeme-icon { font-size: 56px; margin-bottom: 16px; }
  .dekujeme-wrap h1 { font-size: 28px; color: #1a3a2a; margin-bottom: 12px; }
  .dekujeme-wrap .plan-info {
    background: #f0faf4;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 20px 0;
    font-size: 15px;
    color: #1a3a2a;
  }
  .dekujeme-wrap p { color: #555; font-size: 15px; margin-bottom: 10px; }
  .dekujeme-wrap .btn-main {
    display: inline-block;
    background: #ff8a3d;
    color: #fff;
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 999px;
    text-decoration: none;
    margin-top: 12px;
    font-size: 16px;
  }
  .dekujeme-wrap .btn-portal {
    display: inline-block;
    color: #0aa;
    font-size: 14px;
    margin-top: 20px;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  #portal-loading { display: none; font-size: 13px; color: #888; margin-top: 8px; }
</style>
</head>
<body style="background:#fbf4e7; font-family:'Montserrat',sans-serif;">

<div class="dekujeme-wrap">
  <div class="dekujeme-icon">🎉</div>
  <h1>Vítejte v Žiju60plus!</h1>

  <div class="plan-info" id="plan-info">
    Načítáme detaily vašeho plánu…
  </div>

  <p>Fakturu obdržíte na váš e-mail.</p>
  <a href="plan.html" class="btn-main">Zobrazit můj plán</a>

  <br>
  <button class="btn-portal" id="btn-portal" style="display:none;">
    Správa / zrušení předplatného
  </button>
  <div id="portal-loading">Přesměrováváme na portál…</div>
</div>

<script>
const PLAN_MESSAGES = {
  access30:  "Platba <strong>299 Kč</strong> přijata ✓<br>Máte 30 dní plného přístupu.",
  direct90:  "Platba <strong>699 Kč</strong> přijata ✓<br>Máte 90 dní plného přístupu.",
  upgrade90: "Platba <strong>400 Kč</strong> přijata ✓<br>Přístup prodloužen na 90 dní.",
  yearly:    "Platba <strong>499 Kč/rok</strong> přijata ✓<br>Roční předplatné aktivováno.",
};

const PLAN_ACCESS = {
  access30:  '30d',
  direct90:  '90d',
  upgrade90: '90d',
  yearly:    'yearly',
};

(async () => {
  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan") || "access30";
  const sessionId = params.get("session_id");

  // Ulož přístupovou úroveň do localStorage
  const level = PLAN_ACCESS[plan];
  if (level) {
    try {
      localStorage.setItem('ziju60_access', JSON.stringify({ level, ts: Date.now() }));
    } catch (_) {}
  }

  const planInfo = document.getElementById("plan-info");
  planInfo.innerHTML = PLAN_MESSAGES[plan] || "Váš plán byl aktivován.";

  // Načti customer_id ze Stripe session a zobraz portál tlačítko
  if (sessionId) {
    try {
      const res = await fetch(`/api/get-session?session_id=${sessionId}`);
      if (res.ok) {
        const data = await res.json();
        if (data.customer_id) {
          const btn = document.getElementById("btn-portal");
          btn.style.display = "inline-block";
          btn.dataset.customerId = data.customer_id;
          btn.addEventListener("click", async () => {
            btn.style.display = "none";
            document.getElementById("portal-loading").style.display = "block";
            try {
              const r = await fetch("/api/customer-portal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ customer_id: data.customer_id }),
              });
              const d = await r.json();
              if (d.url) window.location.href = d.url;
            } catch (_) {
              document.getElementById("portal-loading").textContent = "Chyba – zkuste to znovu.";
            }
          });
        }
      }
    } catch (_) {}
  }
})();
</script>

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
</body>
</html>
